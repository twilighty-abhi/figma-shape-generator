<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: var(--figma-color-bg, #fff);
    --bg2: var(--figma-color-bg-secondary, #f5f5f5);
    --bg3: var(--figma-color-bg-tertiary, #e6e6e6);
    --hover: var(--figma-color-bg-hover, #f0f0f0);
    --fg: var(--figma-color-text, #1e1e1e);
    --fg2: var(--figma-color-text-secondary, #6e6e6e);
    --fg3: var(--figma-color-text-tertiary, #a0a0a0);
    --border: var(--figma-color-border, #e6e6e6);
    --brand: var(--figma-color-bg-brand, #0d99ff);
    --brand-soft: var(--figma-color-bg-selected, #e5f4ff);
    --onbrand: var(--figma-color-text-onbrand, #fff);
    --paper: #F4F2F0;
    --r: 6px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 11px/16px Inter, system-ui, -apple-system, sans-serif; color: var(--fg); background: var(--bg); -webkit-font-smoothing: antialiased; user-select: none; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }

  .app { display: grid; grid-template-columns: 200px 268px 1fr; grid-template-rows: minmax(0, 1fr) auto; height: 100vh; }
  .col { min-height: 0; overflow-y: auto; }
  .col + .col { border-left: 1px solid var(--border); }

  /* ---------- gallery ---------- */
  .gallery { padding: 10px 8px 12px 10px; }
  .tabs { display: flex; gap: 2px; padding: 2px; background: var(--bg2); border-radius: var(--r); margin-bottom: 10px; position: sticky; top: 0; z-index: 1; }
  .tabs button { flex: 1; border: 0; background: none; padding: 4px 0; border-radius: 4px; color: var(--fg2); }
  .tabs button.on { background: var(--bg); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .group-title { font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--fg3); margin: 4px 2px 6px; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
  .tile { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: var(--r); background: var(--bg2); border: 1.5px solid transparent; padding: 0; transition: background .1s; }
  .tile:hover { background: var(--bg3); }
  .tile.on { border-color: var(--brand); background: var(--brand-soft); }
  .tile svg { width: 70%; height: 70%; }

  /* ---------- stage ---------- */
  .stage { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .title { display: flex; align-items: baseline; gap: 6px; }
  .title h1 { margin: 0; font-size: 13px; line-height: 20px; font-weight: 600; }
  .title .tag { color: var(--fg3); }
  .preview { position: relative; aspect-ratio: 1; border-radius: 10px; background: var(--paper); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .preview[data-bg=white] { background: #fff; box-shadow: inset 0 0 0 1px var(--border); }
  .preview[data-bg=dark] { background: #1e1e1e; }
  .preview[data-bg=checker] { background: repeating-conic-gradient(#e9e9e9 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
  .preview .shape { width: 78%; height: 78%; display: flex; align-items: center; justify-content: center; }
  .preview .shape svg { max-width: 100%; max-height: 100%; width: auto; height: auto; }
  .bgs { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; padding: 3px; border-radius: 12px; background: rgba(255,255,255,.75); backdrop-filter: blur(4px); opacity: 0; transition: opacity .15s; }
  .preview:hover .bgs { opacity: 1; }
  .bgs button { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,.2); padding: 0; }
  .bgs button.on { outline: 2px solid var(--brand); outline-offset: 1px; }
  .dims { position: absolute; left: 8px; bottom: 8px; font-size: 10px; color: rgba(0,0,0,.4); font-variant-numeric: tabular-nums; }
  .preview[data-bg=dark] .dims { color: rgba(255,255,255,.4); }

  .btns { display: flex; gap: 6px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 28px; padding: 0 10px; border-radius: var(--r); border: 1px solid var(--border); background: var(--bg); white-space: nowrap; }
  .btn:hover { background: var(--hover); }
  .btn.grow { flex: 1; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--onbrand); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  kbd { font: inherit; font-size: 10px; color: var(--fg3); border: 1px solid var(--border); border-radius: 3px; padding: 0 3px; line-height: 13px; }
  .btn.primary kbd { color: inherit; border-color: rgba(255,255,255,.4); }

  .sub { display: flex; align-items: center; justify-content: space-between; color: var(--fg2); }
  .link { border: 0; background: none; color: var(--brand); padding: 0; }
  .vars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .vars button { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; padding: 0; border-radius: var(--r); background: var(--paper); border: 1.5px solid transparent; }
  .vars button:hover { border-color: var(--brand); }
  .vars svg { width: 76%; height: 76%; }

  /* ---------- inspector ---------- */
  .inspector { padding: 4px 0 12px; }
  details { border-bottom: 1px solid var(--border); }
  summary { list-style: none; display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 6px; font-weight: 600; cursor: pointer; }
  summary::-webkit-details-marker { display: none; }
  summary .chev { width: 10px; height: 10px; stroke: var(--fg3); fill: none; stroke-width: 1.5; transition: transform .15s; }
  details:not([open]) summary .chev { transform: rotate(-90deg); }
  .fields { padding: 0 14px 12px; display: flex; flex-direction: column; gap: 6px; }

  .field { display: grid; grid-template-columns: 90px 1fr 44px; align-items: center; gap: 8px; min-height: 22px; }
  .field .name { color: var(--fg2); cursor: default; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .field .name:hover { color: var(--fg); }
  .num { width: 44px; height: 20px; text-align: right; border: 1px solid transparent; border-radius: 4px; background: none; padding: 0 4px; font-variant-numeric: tabular-nums; }
  .num:hover { border-color: var(--border); }
  .num:focus { outline: none; border-color: var(--brand); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 16px; background: none; margin: 0; cursor: pointer; }
  input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(var(--brand), var(--brand)) 0 / var(--p, 0%) 100% no-repeat, var(--bg3); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4px; border-radius: 50%; background: #fff; border: 1px solid rgba(0,0,0,.15); box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  input[type=range]:focus { outline: none; }
  input[type=range]:focus::-webkit-slider-thumb { border-color: var(--brand); }

  .seg { display: flex; gap: 2px; padding: 2px; background: var(--bg2); border-radius: var(--r); }
  .seg button { flex: 1; border: 0; background: none; padding: 3px 0; border-radius: 4px; color: var(--fg2); text-transform: capitalize; }
  .seg button.on { background: var(--bg); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  .field .seg { grid-column: 2 / 4; }
  .fields > .targets, .fields > .swatches, .fields > .sub { margin-top: 2px; }
  .targets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .target { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--r); border: 1px solid var(--border); background: var(--bg); text-align: left; }
  .target.on { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
  .target .chip { width: 18px; height: 18px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); flex: none; }
  .target small { display: block; color: var(--fg3); font-size: 10px; line-height: 12px; }
  .target span { line-height: 14px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .sw { position: relative; width: 22px; height: 22px; border-radius: 50%; border: 0; padding: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
  .sw.sel { box-shadow: inset 0 0 0 1px rgba(0,0,0,.12), 0 0 0 2px var(--bg), 0 0 0 3.5px var(--fg); }
  .sw .x { display: none; position: absolute; top: -5px; right: -5px; width: 13px; height: 13px; border-radius: 50%; background: var(--fg); color: var(--bg); font-size: 9px; line-height: 13px; text-align: center; }
  .sw:hover .x { display: block; }
  .add { position: relative; width: 22px; height: 22px; border-radius: 50%; border: 1.5px dashed var(--fg3); display: flex; align-items: center; justify-content: center; color: var(--fg2); font-size: 14px; line-height: 1; }
  .add:hover { border-color: var(--fg); color: var(--fg); }
  .add input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .check { display: flex; align-items: center; gap: 6px; color: var(--fg2); }
  .check input { margin: 0; accent-color: var(--brand); }

  /* ---------- footer ---------- */
  footer { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-top: 1px solid var(--border); }
  .inline { display: flex; align-items: center; gap: 6px; color: var(--fg2); }
  .box { height: 28px; border: 1px solid var(--border); border-radius: var(--r); background: var(--bg); padding: 0 6px; }
  .box:focus { outline: none; border-color: var(--brand); }
  input.box { width: 52px; font-variant-numeric: tabular-nums; }
  .sep { width: 1px; height: 20px; background: var(--border); }
  .spacer { flex: 1; }
  .toggle { position: relative; width: 26px; height: 14px; border-radius: 7px; background: var(--bg3); border: 0; padding: 0; transition: background .15s; }
  .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: transform .15s; }
  .toggle.on { background: var(--brand); }
  .toggle.on::after { transform: translateX(12px); }

  .text-in { grid-column: 2 / 4; height: 24px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); padding: 0 6px; }
  .text-in:focus { outline: none; border-color: var(--brand); }
  .editing[hidden] { display: none; }
  .editing { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 10px; border-radius: var(--r); background: var(--brand-soft); color: var(--fg); }
  .editing .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); flex: none; animation: pulse 1.6s infinite; }
  .editing span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .editing .btn { height: 22px; padding: 0 8px; }
  @keyframes pulse { 50% { opacity: .35; } }
  .hint { color: var(--fg3); }
  .doc-empty { color: var(--fg3); line-height: 15px; }
  .range2 { grid-column: 2 / 4; display: flex; align-items: center; gap: 6px; color: var(--fg3); }
  .range2 input, .count-in { width: 56px; height: 22px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); padding: 0 6px; font-variant-numeric: tabular-nums; }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; }
  .field select { grid-column: 2 / 4; height: 24px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); padding: 0 4px; }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.wide { width: 100%; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 4px; border: 2px solid var(--bg); }
</style>
</head>
<body>
<div class="app">
  <aside class="col gallery">
    <div class="tabs" id="tabs">
      <button data-g="all" class="on">All</button>
      <button data-g="Geometric" title="Geometric">Geo</button>
      <button data-g="Freeform" title="Freeform">Free</button>
      <button data-g="Stickers" title="Stickers">Stickers</button>
    </div>
    <div id="gallery"></div>
  </aside>

  <main class="col stage">
    <div class="editing" id="editing" hidden><i class="dot"></i><span id="editingName"></span><button class="btn" id="doneEditing" title="Stop editing the selected shape">Done</button></div>
    <div class="title"><h1 id="name"></h1><span class="tag" id="tag"></span></div>
    <div class="preview" id="preview" data-bg="paper">
      <div class="shape" id="shape"></div>
      <div class="bgs" id="bgs">
        <button data-bg="paper" style="background:#F4F2F0" title="Paper" class="on"></button>
        <button data-bg="white" style="background:#fff" title="White"></button>
        <button data-bg="dark" style="background:#1e1e1e" title="Dark"></button>
        <button data-bg="checker" style="background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/6px 6px" title="Transparent"></button>
      </div>
      <div class="dims" id="dims"></div>
    </div>
    <div class="btns">
      <button class="btn grow" id="shuffle" title="Re-roll randomness (Space)">
        <svg viewBox="0 0 16 16"><path d="M2 4h3l6 8h3M2 12h3l1.5-2M9.5 6 11 4h3M12 2l2 2-2 2M12 10l2 2-2 2"/></svg>Shuffle <kbd>Space</kbd>
      </button>
      <button class="btn" id="reset" title="Reset to preset defaults">
        <svg viewBox="0 0 16 16"><path d="M3 8a5 5 0 1 0 1.5-3.5M3 2.5V5h2.5"/></svg>Reset
      </button>
    </div>
    <div>
      <div class="sub" style="margin-bottom:6px"><span>Variations</span><button class="link" id="revary" title="New variations (V)">Refresh</button></div>
      <div class="vars" id="vars"></div>
    </div>
  </main>

  <section class="col inspector" id="inspector"></section>

  <footer>
    <label class="inline">Size <input class="box" type="number" id="size" value="200" min="8" max="4000" /> px</label>
    <label class="inline" title="Convert line shapes (squiggles, curls) to filled outlines">
      <button class="toggle on" id="outline" role="switch" aria-checked="true"></button> Outline strokes
    </label>
    <span class="spacer"></span>
    <span class="inline">
      Sheet <input class="box" type="number" id="sheetCount" value="12" min="2" max="100" style="width:44px" title="How many shapes" />
      <select class="box" id="sheetMode" title="Which shapes go on the sheet">
        <option value="type">of this shape</option>
        <option value="all">of all shapes</option>
        <option value="Geometric">geometric</option>
        <option value="Freeform">freeform</option>
        <option value="Stickers">stickers</option>
      </select>
      <button class="btn" id="insertSheet">Insert sheet</button>
    </span>
    <span class="sep"></span>
    <button class="btn primary" id="insert" title="Insert (Enter)">Insert shape <kbd>↵</kbd></button>
  </footer>
</div>

<script>
/*__ENGINE__*/
</script>
<script>
/*__APP__*/
</script>
</body>
</html>
